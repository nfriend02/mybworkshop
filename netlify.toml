[build]
  command = "bash netlify/build.sh"
  publish = "build/web"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "20"

# API routes must win over the Flutter SPA fallback.
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    Content-Security-Policy = "frame-ancestors 'self' https://hswarehouse.netlify.app https://*.netlify.app"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
