name: mybworkshop
description: "My AI Workshop — MyBranch portfolio branch app (Flutter + Firebase + Netlify)."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.13.3

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  firebase_core: ^4.15.0
  cloud_firestore: ^6.10.0
  firebase_auth: ^6.3.0
  flutter_dotenv: ^6.0.1
  go_router: ^18.0.1
  provider: ^6.1.5+1
  google_fonts: ^8.2.1
  file_picker: ^13.1.0
  qr_flutter: ^4.1.0
  image: ^4.8.0
  archive: ^4.0.9
  http: ^1.6.0
  web: ^1.1.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/config/app.env
